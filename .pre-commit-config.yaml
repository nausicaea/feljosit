# Install: pipx run pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types:
- pre-commit
- commit-msg
- pre-push
repos:
  - hooks:
    - id: commitizen
    - id: commitizen-branch
      stages:
      - pre-push
    repo: https://github.com/commitizen-tools/commitizen
    rev: v4.20.1
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
