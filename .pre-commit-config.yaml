# Install: uv run --with pre-commit pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types:
- pre-commit
- commit-msg
- pre-push
repos:
  - hooks:
    - id: commitizen
    - id: commitizen-branch
      stages:
      - pre-push
    repo: https://github.com/commitizen-tools/commitizen
    rev: v4.20.1
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]
