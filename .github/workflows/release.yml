name: Release

# Build one executable file for each operating system when a version tag is pushed
# (see CONTRIBUTING.md). The users copy the file. No installation is necessary.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static executables (musl): they run on all Linux distributions.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            file: feljosit
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            file: feljosit
          # The C runtime is in the executable: no Visual C++ redistributable.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: feljosit.exe
            rustflags: -C target-feature=+crt-static
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            file: feljosit
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            file: feljosit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test the executable
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/${{ matrix.file }} --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Name the files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for dir in artifacts/*; do
            name=$(basename "$dir")
            for file in "$dir"/*; do
              extension=""
              case "$file" in *.exe) extension=".exe" ;; esac
              cp "$file" "dist/feljosit-${TAG}-${name}${extension}"
            done
          done
          chmod +x dist/*
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPOSITORY" --title "Feljosit $TAG" --generate-notes
