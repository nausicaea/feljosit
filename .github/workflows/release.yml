name: Release

# Build one executable file for each operating system when a version tag is pushed
# (see CONTRIBUTING.md). The users copy the file. No installation is necessary.
# The workflow also publishes a signed container image with the Linux executables
# (see ADR-0022).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static executables (musl): they run on all Linux distributions.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            file: feljosit
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            file: feljosit
          # The C runtime is in the executable: no Visual C++ redistributable.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: feljosit.exe
            rustflags: -C target-feature=+crt-static
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            file: feljosit
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            file: feljosit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test the executable
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/${{ matrix.file }} --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Name the files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for dir in artifacts/*; do
            name=$(basename "$dir")
            for file in "$dir"/*; do
              extension=""
              case "$file" in *.exe) extension=".exe" ;; esac
              cp "$file" "dist/feljosit-${TAG}-${name}${extension}"
            done
          done
          chmod +x dist/*
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPOSITORY" --title "Feljosit $TAG" --generate-notes

  container:
    name: Publish the container image
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push the image to the GitHub Container Registry.
      packages: write
      # Get an OIDC token for the keyless signature (Sigstore).
      id-token: write
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image contains the same static executables as the GitHub release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: dist/linux-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-aarch64
          path: dist/linux-arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Make the tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Feljosit
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=Unlicense
          annotations: |
            org.opencontainers.image.title=Feljosit
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=Unlicense
      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BINARY=prebuilt
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          # Attach the SLSA provenance and an SBOM to the image.
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless signature: the certificate identifies this workflow and the tag.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          cosign sign --yes --recursive "$image"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          cosign verify "$image" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
