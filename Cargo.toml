[package]
name = "feljosit"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first personal budgeting for the Swiss financial sector, with ISO 20022 camt.053 import."
readme = "README.md"
license = "Unlicense"
publish = false


[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
jiff = { version = "=1.0.3", features = ["serde"] }
getrandom = "=0.4.3"
minijinja = { version = "=3.1.0", features = ["preserve_order", "serde"] }
roxmltree = "=0.21.2"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.11.2"
zip = { version = "=9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Argon2 is very slow without optimisation. This keeps the tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

