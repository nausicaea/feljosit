[project]
name = "feljosit"
version = "0.2.0"
description = "Local-first personal budgeting for the Swiss financial sector, with ISO 20022 camt.053 import."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "defusedxml==0.7.1",
    "fastapi==0.165.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.34",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[project.scripts]
feljosit = "feljosit.cli:main"

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen==4.20.1",
    "httpx2==2.16.2",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "types-defusedxml==0.7.0.20260504",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT", "C4", "PL", "RET", "PTH", "ERA",
]
ignore = [
    "PLR0913", # Many keyword-only arguments are clear in service functions.
    "PLR2004", # Magic values are fine in tests and money code.
    "RUF001",  # The UI intentionally uses typographic characters.
    "RUF002",
    "RUF003",
    "PLR0917", # FastAPI route handlers declare each form field as a parameter.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PT018", "PLC0415"]
"src/feljosit/migrations/versions/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = []
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["feljosit.migrations.versions.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["feljosit"]
branch = true
omit = ["*/feljosit/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_files = ["src/feljosit/__init__.py:__version__"]
