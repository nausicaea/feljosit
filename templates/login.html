{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in to Feljosit</h1>
  {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <label>Username <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Forgot the password? Run <code>feljosit set-password NAME</code> in a terminal.</p>
</section>
{% endblock %}
