{% extends "base.html" %}
{% from "macros.html" import csrf with context %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<section class="card narrow">
  <h2>Change the password</h2>
  <form method="post" action="/settings/password" class="stack">
    {{ csrf() }}
    <input type="text" name="username" value="{{ auth.user.username }}" autocomplete="username" hidden>
    <label>Current password <input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password (minimum 12 characters) <input type="password" name="new_password" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input type="password" name="new_password_repeat" autocomplete="new-password" minlength="12" required></label>
    <button type="submit">Change the password</button>
  </form>
  <p class="hint">When you change the password, all other sessions close.</p>
</section>
{% endblock %}
